# Upptime-config voor status.traqrr.com (repo sschip1301/traqrr-status, aangemaakt uit de template upptime/upptime).
# Kopieer dit bestand naar de root van die repo. Zie infra/status/README.md.
owner: sschip1301
repo: traqrr-status

sites:
  # /api/health: 503 + "down" als de database weg is, "degraded" als de worker geen hartslag meer geeft.
  - name: Website en app
    url: https://traqrr.com/api/health
    expectedStatusCodes: [200]
    maxResponseTime: 5000
    __dangerous__body_down: '"status":"down"'
  - name: Orderbewaking
    url: https://traqrr.com/api/health
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"worker":"ok"'
  # /api/public/status: geaggregeerd per onderdeel (src/server/publicStatus.ts); volgorde key, status ligt vast.
  - name: Koersen
    url: https://traqrr.com/api/public/status
    expectedStatusCodes: [200]
    __dangerous__body_degraded: '"key":"market","status":"degraded"'
    __dangerous__body_down: '"key":"market","status":"down"'
  - name: Exchanges
    url: https://traqrr.com/api/public/status
    expectedStatusCodes: [200]
    __dangerous__body_degraded: '"key":"exchanges","status":"degraded"'
    __dangerous__body_down: '"key":"exchanges","status":"down"'

status-website:
  cname: status.traqrr.com
  name: TRAQRR Status
  introTitle: "Status van TRAQRR"
  introMessage: ""
  logoUrl: https://traqrr.com/icon-192.png
  favicon: https://traqrr.com/icon-192.png
  theme: dark
  navbar:
    - title: TRAQRR
      href: https://traqrr.com
    - title: Hulp
      href: https://traqrr.com/hulp
  # Huisstijl (docs/HUISSTIJL.md): grafiet, warm wit, goud accent.
  css: |
    :root { --body-background-color: #111315; --card-background-color: #191C20; --body-text-color: #F3F0E8; --nav-background-color: #111315; --nav-border-bottom-color: #2A2F35; --tag-up-background-color: #79C7A5; --tag-down-background-color: #F08D96; --tag-degraded-background-color: #EBCB8B; }
    a { color: #E7B567; }

